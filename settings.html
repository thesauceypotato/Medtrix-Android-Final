<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEDTRIX | Settings</title>
    <script src="medtrix_core.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- RESTORED ORIGINAL THEME --- */
        :root {
            --bg: #f3f4f6; --bg-gradient: radial-gradient(circle at 0% 0%, #e0f2fe, #f3f4f6);
            --glass: rgba(255, 255, 255, 0.85); --border: 1px solid rgba(255, 255, 255, 0.9);
            --text: #1f2937; --danger: #ef4444; --accent: #2563eb;
        }
        [data-theme="dark"] {
            --bg: #0f172a; --bg-gradient: radial-gradient(circle at 50% 0%, #1e293b, #0f172a);
            --glass: rgba(30, 41, 59, 0.75); --border: 1px solid rgba(255, 255, 255, 0.08);
            --text: #f1f5f9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); background-image: var(--bg-gradient); color: var(--text); min-height: 100vh; padding: 20px; }

        .container { max-width: 600px; margin: 40px auto; padding-bottom: 50px; }
        
        .header { display: flex; align-items: center; margin-bottom: 30px; }
        .back-btn { font-size: 1.5rem; color: var(--text); text-decoration: none; margin-right: 20px; }
        h1 { font-family: 'Orbitron'; font-size: 2rem; }

        .section {
            background: var(--glass); border: var(--border); border-radius: 20px;
            padding: 25px; margin-bottom: 20px; backdrop-filter: blur(12px);
        }
        .section h2 { font-size: 1.1rem; margin-bottom: 15px; opacity: 0.8; text-transform: uppercase; letter-spacing: 1px; }

        .row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid rgba(128,128,128,0.1); }
        .row:last-child { border-bottom: none; }

        .btn {
            padding: 10px 20px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer;
            transition: 0.2s; font-size: 0.9rem;
        }
        .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); }
        .btn-danger:active { background: var(--danger); color: white; }
        
        /* New Buttons for AI that match your theme */
        .btn-primary { background: var(--accent); color: white; width: 100%; margin-top: 10px; }
        .btn-test { background: transparent; border: 1px solid var(--accent); color: var(--accent); margin-top: 10px; width: 100%; }

        .storage-bar { height: 6px; width: 100%; background: rgba(128,128,128,0.2); border-radius: 3px; margin-top: 5px; overflow: hidden; }
        .storage-fill { height: 100%; background: var(--accent); width: 0%; transition: width 1s; }

        /* --- NEW STYLES FOR INPUTS (Matching your Glass theme) --- */
        .input-group { margin-bottom: 15px; }
        .input-label { display: block; font-size: 0.85rem; opacity: 0.8; margin-bottom: 5px; }
        
        .styled-input, .styled-select {
            width: 100%; padding: 12px; border-radius: 8px;
            border: 1px solid rgba(128,128,128,0.3);
            background: rgba(255,255,255,0.5); /* Semi-transparent to match glass */
            color: var(--text); 
            font-family: inherit; font-size: 0.95rem;
        }
        /* Dark mode adjustment for inputs */
        [data-theme="dark"] .styled-input, 
        [data-theme="dark"] .styled-select { 
            background: rgba(0,0,0,0.2); 
        }

        .styled-input:focus, .styled-select:focus { outline: none; border-color: var(--accent); }
        
        #custom-url-group { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <h1>Settings</h1>
        </div>

        <!-- 1. AI CONFIGURATION (New Feature, Original Look) -->
        <div class="section">
            <h2><i class="fas fa-robot"></i> AI Configuration</h2>
            
            <div class="input-group">
                <label class="input-label">Provider</label>
                <select id="ai-provider" class="styled-select" onchange="toggleAiFields()">
                    <option value="google">Google Gemini (Recommended)</option>
                    <option value="openai">OpenAI Compatible (Groq/DeepSeek/etc)</option>
                </select>
            </div>

            <div class="input-group">
                <label class="input-label">API Key</label>
                <input type="password" id="ai-key" class="styled-input" placeholder="Paste API Key here...">
            </div>

            <div class="input-group">
                <label class="input-label">Model Name</label>
                <input type="text" id="ai-model" class="styled-input" placeholder="e.g. gemini-2.5-flash-lite">
            </div>

            <div class="input-group" id="custom-url-group">
                <label class="input-label">Base URL (For generic providers)</label>
                <input type="text" id="ai-url" class="styled-input" placeholder="e.g. https://api.groq.com/openai/v1">
            </div>

            <button class="btn btn-primary" onclick="saveAiSettings()">SAVE CONFIGURATION</button>
            <button class="btn btn-test" onclick="testAiConnection()">Test Connection</button>
        </div>

        <!-- 2. DATA MANAGEMENT (Original) -->
        <div class="section">
            <h2>Data Management</h2>
            
            <div class="row">
                <div>
                    <b>Factory Reset</b>
                    <p style="font-size:0.8rem; opacity:0.7;">Deletes all history, bookmarks & scores.</p>
                </div>
                <button class="btn btn-danger" onclick="hardReset()">RESET</button>
            </div>

            <div class="row">
                <div>
                    <b>Clear Offline Cache</b>
                    <p style="font-size:0.8rem; opacity:0.7;">Deletes downloaded files/updates.</p>
                </div>
                <button class="btn btn-danger" onclick="clearCache()">CLEAR</button>
            </div>
        </div>

        <!-- 3. STORAGE (Original) -->
        <div class="section">
            <h2>Offline Storage</h2>
            <div style="margin-bottom:10px;">
                <span id="storage-txt">Checking usage...</span>
            </div>
            <div class="storage-bar"><div class="storage-fill" id="s-fill"></div></div>
        </div>

        <!-- 4. ABOUT (Original) -->
        <div class="section">
            <h2>System Info</h2>
            <div class="row">
                <span>Version</span>
                <span>3.5 (AI Edition)</span>
            </div>
            <div class="row">
                <span>Mode</span>
                <span id="mode-status">Online</span>
            </div>
        </div>
    </div>

    <script>
        // --- AI SETTINGS LOGIC ---
        const savedConfig = JSON.parse(localStorage.getItem(MEDTRIX.config.aiKey)) || {
            provider: 'google',
            key: '',
            model: 'gemini-2.5-flash-lite', 
            url: ''
        };

        // Populate Fields
        document.getElementById('ai-provider').value = savedConfig.provider;
        document.getElementById('ai-key').value = savedConfig.key;
        document.getElementById('ai-model').value = savedConfig.model;
        document.getElementById('ai-url').value = savedConfig.url;
        
        toggleAiFields(); 

        function toggleAiFields() {
            const provider = document.getElementById('ai-provider').value;
            const urlGroup = document.getElementById('custom-url-group');
            const modelInput = document.getElementById('ai-model');

            if (provider === 'google') {
                urlGroup.style.display = 'none';
                if(!modelInput.value) modelInput.value = 'gemini-2.5-flash-lite';
            } else {
                urlGroup.style.display = 'block';
                if(modelInput.value.includes('gemini')) modelInput.value = 'gpt-3.5-turbo';
            }
        }

        function saveAiSettings() {
            const config = {
                provider: document.getElementById('ai-provider').value,
                key: document.getElementById('ai-key').value.trim(),
                model: document.getElementById('ai-model').value.trim(),
                url: document.getElementById('ai-url').value.trim()
            };

            if(!config.key) { alert("Please enter an API Key."); return; }
            localStorage.setItem(MEDTRIX.config.aiKey, JSON.stringify(config));
            MEDTRIX.ui.toast("AI Configuration Saved!");
        }

        async function testAiConnection() {
            saveAiSettings();
            const btn = document.querySelector('.btn-test');
            const originalText = btn.innerText;
            btn.innerText = "Testing...";
            
            const response = await MEDTRIX.ai.ask("Say 'Connection Successful'", "System Test");
            
            if(response.includes("Error") || response.includes("unavailable")) {
                alert("Connection Failed:\n" + response);
            } else {
                alert("SUCCESS! AI Responded:\n" + response);
            }
            btn.innerText = originalText;
        }

        // --- ORIGINAL UTILS ---
        async function checkStorage() {
            if ('storage' in navigator && 'estimate' in navigator.storage) {
                const {usage, quota} = await navigator.storage.estimate();
                const used = (usage / 1024 / 1024).toFixed(2);
                const percent = Math.round((usage / quota) * 100);
                document.getElementById('storage-txt').innerText = `${used} MB Used`;
                document.getElementById('s-fill').style.width = `${percent}%`;
            }
        }
        checkStorage();

        document.getElementById('mode-status').innerText = navigator.onLine ? "Online" : "Offline";

        async function clearCache() {
            if(!confirm("Clear downloaded cache files? Pages will reload from internet.")) return;
            if('caches' in window) {
                const keys = await caches.keys();
                await Promise.all(keys.map(key => caches.delete(key)));
                alert("Cache Cleared.");
                location.reload();
            } else {
                alert("Caching not supported in this environment.");
            }
        }
    </script>
</body>
</html>
